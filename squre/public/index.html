<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Guo Moruo Square</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cambria', serif;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            /* 字体颜色调整为柔和的米灰色，避免过亮 */
            color: #E0E0E0; 
            min-height: 100vh;
            position: relative;
            background: url('images/background.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: brightness(80%);
            display: flex;
            flex-direction: column;
        }
        
        .container, .header, .footer {
            filter: brightness(100%);
        }
        
        .header {
            height: 25vh;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .header h1 {
            color: #E0E0E0;
            font-size: 3.8vw;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            letter-spacing: 2.5px;
            text-align: center;
            padding: 20px 45px;
            background: rgba(0, 0, 0, 0.3); /* 背景稍微加深以衬托文字 */
            border-radius: 12px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 2;
            animation: fadeIn 1.5s ease-out;
            max-width: 90%;
            font-weight: 700;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            overflow: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            height: 100%;
            max-height: 65vh;
        }
        
        .icon-grid {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 40px;
            padding: 20px 0;
        }
        
        .left-icons { align-items: flex-start; }
        .right-icons { align-items: flex-end; }
        
        .icon-item {
            text-align: center;
            transition: all 0.4s ease;
            /* 左侧图标整体向左移动半个身位 */
            transform: translateX(-40px);
        }
        
        /* 修改后的图标容器样式 */
        .icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            /* 1. 提高背景亮度和对比度 */
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(8px);
            /* 2. 增加更明显的外部发光，使其从背景中跳脱出来 */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* 3. 强化边框颜色 */
            border: 2px solid rgba(255, 255, 255, 0.6); 
        }
        
        .icon:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
        
        /* 4. 修改图标本身的颜色为纯白，增加阴影 */
        .icon i {
            font-size: 35px;
            color: #FFFFFF; /* 纯白比 E0E0E0 更显眼 */
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }
        
        /* 5. 悬停时的增强效果 */
        .icon:hover {
            transform: scale(1.15) rotate(5deg); /* 增加一点旋转感 */
            background: rgba(255, 255, 255, 0.4);
            border-color: #FFFFFF;
            /* 霓虹发光感 */
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        /* 6. 可选：为不同功能的图标添加专属色调（更加显眼） */
        .left-icons .icon:hover { 
            box-shadow: 0 0 30px rgba(74, 144, 226, 0.8); /* 地图蓝色光 */
            border-color: #4A90E2;
        }
        
        .right-icons .icon-item:first-child .icon:hover { 
            box-shadow: 0 0 30px rgba(245, 166, 35, 0.8); /* 少年班金色光 */
            border-color: #F5A623;
        }
        
        .right-icons .icon-item:last-child .icon:hover { 
            box-shadow: 0 0 30px rgba(80, 227, 194, 0.8); /* 纪念像青色光 */
            border-color: #50E3C2;
        }
        
        .icon-label {
            color: #FFFFFF; /* 改为纯白 */
            font-size: 1rem;
            letter-spacing: 1.2px;
            margin-top: 15px;
            /* 增强文字背后的阴影，防止被背景吞没 */
            text-shadow: 0 0 10px rgba(0, 0, 0, 1), 0 2px 4px rgba(0, 0, 0, 0.8);
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .dialogue-box {
            background: rgba(0, 0, 0, 0.4); /* 增加内部黑度，减少刺眼感 */
            border-radius: 20px;
            padding: 40px 40px 80px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            backdrop-filter: blur(12px);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .dialogue-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #E0E0E0;
            text-align: center;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }
        
        .dialogue-text {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #E0E0E0;
            font-weight: 500;
        }

        .typewriter-text {
            border-right: .15em solid #E0E0E0;
            white-space: pre-wrap;
            animation: blink-caret .75s step-end infinite;
        }
        
        .quote-mark {
            font-size: 5rem;
            color: rgba(255, 255, 255, 0.15);
            position: absolute;
            font-family: Georgia, serif;
        }
        
        .quote-start { top: 10px; left: 20px; }
        .quote-end { bottom: 60px; right: 20px; }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
        }
        
        .page-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #E0E0E0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .page-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        
        .page-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .page-dot.active {
            background: #E0E0E0;
            transform: scale(1.3);
        }

        /* =====================================
           Guo Moruo Character + AI Chat
        ===================================== */
        .character-chat {
            position: fixed;
            left: 20px;
            /* 【修改点】bottom 从 20px 改为 -5px，将整体下移，使图片根部贴紧底部，释放头部空间 */
            bottom: -5px; 
            width: 260px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .guomo-character {
            width: 220px;
            /* 【修改点】大屏下最大高度限制稍微收紧，配合定位下移，确保头部绝对不会被切 */
            max-height: 48vh; 
            object-fit: contain;
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.45));
            pointer-events: none;
        }

        .ai-chat {
            width: 100%;
            color: #E0E0E0;
            /* 【修改点】给对话框底部加一点内边距，使其不会太死贴屏幕边缘 */
            margin-bottom: 12px; 
        }

        .ai-chat-panel {
            background: rgba(0,0,0,0.72);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            padding: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .ai-chat-messages {
            height: 100px;
            overflow-y: auto;
            padding: 4px;
            margin-bottom: 8px;
            font-size: 0.72rem;
            line-height: 1.4;
            text-align: left;
            scrollbar-width: thin;
        }

        .ai-chat-message {
            margin-bottom: 6px;
        }

        .ai-chat-message strong {
            color: #ffffff;
        }

        .ai-chat-form {
            display: flex;
            gap: 6px;
        }

        .ai-chat-input {
            flex: 1;
            min-width: 0;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 7px 10px;
            outline: none;
            font-size: 0.72rem;
        }

        .ai-chat-input::placeholder {
            color: rgba(255,255,255,0.55);
        }

        .ai-chat-input:focus {
            border-color: rgba(255,255,255,0.45);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
        }

        .ai-chat-button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            color: white;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
        }

        .ai-chat-button:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-1px);
        }

        .ai-chat-button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .ai-chat-button svg {
            width: 12px;
            height: 12px;
        }

        /* 避免挡住原页面 */
        @media (max-width: 900px) {
            .character-chat {
                width: 180px;
                left: 10px;
                /* 【修改点】移动端下也同步下移 */
                bottom: -5px; 
            }

            .guomo-character {
                width: 150px;
                /* 【修改点】调整移动端最大高度 */
                max-height: 38vh; 
            }

            .ai-chat-messages {
                height: 80px;
                font-size: 0.65rem;
            }

            .ai-chat-input {
                font-size: 0.65rem;
            }
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #B0B0B0; /* 页脚文字稍暗一点 */
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #E0E0E0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome to Guo Moruo Square</h1>
    </div>
    
    <div class="main-content">
        <div class="container">
            <div class="icon-grid left-icons">
                <div class="icon-item">
                    <a href="https://qianxuesen.netlify.app/" class="icon">
                        <i class="fas fa-mug-hot"></i>
                    </a>
                    <div class="icon-label">Campus Map</div>
                </div>
            </div>
            
            <div class="dialogue-box">
                <div class="quote-mark quote-start">"</div>
                <div class="dialogue-content">
                    <h2 class="dialogue-title">Memories of the Square</h2>
                    <div class="dialogue-text">
                        <div class="typewriter">
                            <div id="typewriter-text" class="typewriter-text"></div>
                        </div>
                    </div>
                </div>
                <div class="quote-mark quote-end">"</div>
                
                <div class="pagination">
                    <button id="prevBtn" class="page-btn"><i class="fas fa-arrow-left"></i> Prev</button>
                    <div class="page-indicator">
                        <div class="page-dot active" id="dot1"></div>
                        <div class="page-dot" id="dot2"></div>
                        <div class="page-dot" id="dot3"></div>
                    </div>
                    <button id="nextBtn" class="page-btn">Next <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="character-chat">
                <img class="guomo-character" src="./images/guomo_suit_cutout_clean.png" alt="Guo Moruo">
                <div class="ai-chat">
                    <div class="ai-chat-panel">
                        <div class="ai-chat-messages" id="chatDisplay">
                            <div class="ai-chat-message">
                                <strong>Guo Moruo:</strong> Welcome to USTC. What would you like to know?
                            </div>
                        </div>

                        <form class="ai-chat-form" id="chatForm">
                            <input class="ai-chat-input" id="userInput" type="text" placeholder="Ask Guo Moruo..." autocomplete="off">
                            <button class="ai-chat-button" id="sendButton" type="submit">
                                <svg viewBox="0 0 24 24" width="12" height="12">
                                    <path d="M3.5 20.5 21 12 3.5 3.5 6 10.5 14 12 6 13.5z" fill="currentColor"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="icon-grid right-icons">
                <div class="icon-item">
                    <a href="https://ggifgifted.netlify.app/" class="icon">
                        <i class="fas fa-graduation-cap"></i>
                    </a>
                    <div class="icon-label">Gifted Program</div>
                </div>
                
                <div class="icon-item">
                    <a href="https://amber2713.github.io/sitetone/memorial/" class="icon">
                        <i class="fas fa-user-friends"></i>
                    </a>
                    <div class="icon-label">Portrait of Guo Moruo</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        Guo Moruo Square © 2023 | A Place of Reflection, Learning, and Community
    </div>

    <script>
        const pages = [
            "I remember Guo Moruo Square as one of the few sanctuaries during my demanding study years. At any hour, you could find students scattered across the grass, textbooks open but eyes gazing upward, finding solace in the open sky above.",
            "What made this space extraordinary was the harmony of sounds: the delighted laughter of neighborhood children chasing kites mingled with earnest philosophical debates beneath the ancient oak.",
            "The square served as a living metaphor for the university—where youthful energy met academic rigor, and community blended with scholarship. In the golden hour before sunset, everything paused in perfect balance."
        ];
        
        let currentPage = 0;
        let typingInterval;
        const textElement = document.getElementById('typewriter-text');
        const dots = document.querySelectorAll('.page-dot');
        
        function typeText(text, element) {
            clearInterval(typingInterval);
            let charIndex = 0;
            element.innerHTML = '';
            typingInterval = setInterval(() => {
                if (charIndex < text.length) {
                    element.innerHTML += text.charAt(charIndex);
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                }
            }, 30);
        }
        
        function updatePage(pageIndex) {
            currentPage = pageIndex;
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentPage);
            });
            typeText(pages[currentPage], textElement);
            document.getElementById('prevBtn').disabled = (currentPage === 0);
            document.getElementById('nextBtn').disabled = (currentPage === pages.length - 1);
        }
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 0) updatePage(currentPage - 1);
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentPage < pages.length - 1) updatePage(currentPage + 1);
        });
        
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => updatePage(index));
        });
        
        document.addEventListener('DOMContentLoaded', () => updatePage(0));

        /* =====================================
           Guo Moruo AI Chat
        ===================================== */
        const chatHistory = [];
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatDisplay = document.getElementById('chatDisplay');
        const sendButton = document.getElementById('sendButton');

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function addChatMessage(role, content) {
            const message = document.createElement('div');
            message.className = 'ai-chat-message';
            const speaker = role === 'user' ? 'You' : 'Guo Moruo';
            message.innerHTML = `<strong>${speaker}:</strong> ${escapeHtml(content)}`;
            chatDisplay.appendChild(message);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            return message;
        }

        async function handleChat(text) {
            chatHistory.push({ role: 'user', content: text });
            addChatMessage('user', text);
            const loadingMessage = addChatMessage('assistant', 'Thinking...');
            sendButton.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                const data = await response.json();
                const content = data.content || 'I have no answer at the moment.';
                chatHistory.push({ role: 'assistant', content });
                loadingMessage.innerHTML = `<strong>Guo Moruo:</strong> ${escapeHtml(content)}`;
            } catch (error) {
                console.error(error);
                loadingMessage.innerHTML = '<strong>Guo Moruo:</strong> Unable to connect right now.';
            } finally {
                sendButton.disabled = false;
                userInput.focus();
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
            }
        }

        if (chatForm && userInput && chatDisplay && sendButton) {
            chatForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const text = userInput.value.trim();
                if (!text || sendButton.disabled) return;
                userInput.value = '';
                handleChat(text);
            });
        }
    </script>
</body>
</html>
